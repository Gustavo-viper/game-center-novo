name: Forge AI - gerar .exe

on:
  push:
    paths:
      - "forge-ai/**"
      - ".github/workflows/forge-ai-exe.yml"
    tags:
      - "forge-ai-v*"
  workflow_dispatch:

permissions:
  contents: write  # necessário só para publicar a release nas tags forge-ai-v*

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: forge-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-app.txt

      - name: Conferir que o app importa
        run: python -c "import app, forge_core; print('ok')"

      - name: Gerar Forge AI.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Forge AI"
          --icon assets/forge.ico
          --add-data "ui;ui"
          --add-data "assets;assets"
          app.py

      - name: Enviar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Forge-AI-Windows
          path: forge-ai/dist/Forge AI.exe

      - name: Publicar release (só em tags forge-ai-v*)
        if: startsWith(github.ref, 'refs/tags/forge-ai-v')
        uses: softprops/action-gh-release@v2
        with:
          files: forge-ai/dist/Forge AI.exe
